[package]
name = "gann-graph-desk"
version = "0.1.0"
description = "W.D. Gann Geometric Drafting Desk"
authors = ["AntiGravity Engineer"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
